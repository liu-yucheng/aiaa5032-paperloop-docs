<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" role="img" aria-labelledby="fig1-title fig1-desc" width="980" height="700">
  <title id="fig1-title">The PaperLoop recursive self-improvement loop</title>
  <desc id="fig1-desc">A snake of eight steps. Papers enter the training forward pass, which writes a loss and a gradient. The backward pass turns the gradient into the next parameters version. The validation pass keeps or rolls back that version. The test pass reports whether the loss improved. The loop then returns to the next paper. A feedback pass writes human supervision into the same loss and gradient.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4fd8"/></marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="700" fill="#ffffff"/>
    <text x="32" y="36" font-family="'Noto Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827" text-anchor="start">Figure 1. The PaperLoop training loop</text>
    <g>
      <rect x="54" y="64" width="200" height="96" rx="12" fill="#f6f8fc" stroke="#c3cbd8" stroke-width="1.4"/>
      <text x="70" y="91" font-family="'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Data</text>
      <text x="70" y="114" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">paper PDFs</text>
      <text x="70" y="132" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">one item = one paper</text>
      <text x="70" y="150" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">a split: train, valid, test</text>
    </g>
    <g>
      <rect x="278" y="64" width="200" height="96" rx="12" fill="#f6f8fc" stroke="#c3cbd8" stroke-width="1.4"/>
      <text x="294" y="91" font-family="'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Train</text>
      <text x="294" y="114" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">/paperloop_forward</text>
      <text x="294" y="132" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">stages 1 to 6</text>
      <text x="294" y="150" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">writes one session</text>
    </g>
    <g>
      <rect x="502" y="64" width="200" height="96" rx="12" fill="#f6f8fc" stroke="#c3cbd8" stroke-width="1.4"/>
      <text x="518" y="91" font-family="'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Loss</text>
      <text x="518" y="114" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">evals/pending/&lt;s&gt;/</text>
      <text x="518" y="132" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">loss.json</text>
      <text x="518" y="150" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">mean(1 - score / 5)</text>
    </g>
    <g>
      <rect x="726" y="64" width="200" height="96" rx="12" fill="#f6f8fc" stroke="#c3cbd8" stroke-width="1.4"/>
      <text x="742" y="91" font-family="'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Gradient</text>
      <text x="742" y="114" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">evolutions/pending/</text>
      <text x="742" y="132" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">&lt;s&gt;/plan.json</text>
      <text x="742" y="150" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">the proposed change</text>
    </g>
    <g>
      <rect x="726" y="232" width="200" height="96" rx="12" fill="#f6f8fc" stroke="#c3cbd8" stroke-width="1.4"/>
      <text x="742" y="259" font-family="'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Backward</text>
      <text x="742" y="282" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">/paperloop_backward</text>
      <text x="742" y="300" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">stage 7 applies the plan</text>
      <text x="742" y="318" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">moves both to applied/</text>
    </g>
    <g>
      <rect x="502" y="232" width="200" height="96" rx="12" fill="#f6f8fc" stroke="#c3cbd8" stroke-width="1.4"/>
      <text x="518" y="259" font-family="'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Parameters</text>
      <text x="518" y="282" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">configs_rw/v(N+1)/</text>
      <text x="518" y="300" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">the model weights</text>
      <text x="518" y="318" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">CHECKPOINT.json</text>
    </g>
    <g>
      <rect x="278" y="232" width="200" height="96" rx="12" fill="#f6f8fc" stroke="#c3cbd8" stroke-width="1.4"/>
      <text x="294" y="259" font-family="'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Validate</text>
      <text x="294" y="282" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">/paperloop_validate</text>
      <text x="294" y="300" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">evals/validated/</text>
      <text x="294" y="318" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">keep, or roll back</text>
    </g>
    <g>
      <rect x="54" y="232" width="200" height="96" rx="12" fill="#f6f8fc" stroke="#c3cbd8" stroke-width="1.4"/>
      <text x="70" y="259" font-family="'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Test</text>
      <text x="70" y="282" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">/paperloop_test</text>
      <text x="70" y="300" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">evals/tested/</text>
      <text x="70" y="318" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">improved or regressed</text>
    </g>
    <g>
      <rect x="726" y="396" width="200" height="116" rx="12" fill="#f6f8fc" stroke="#b45309" stroke-width="1.4" stroke-dasharray="7 5"/>
      <text x="742" y="423" font-family="'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Feedback</text>
      <text x="742" y="446" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">/paperloop_feedback</text>
      <text x="742" y="464" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">--session=&lt;id&gt;</text>
      <text x="742" y="482" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">--feedback=&lt;text&gt;</text>
      <text x="742" y="500" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" fill="#5b6472">rewrites the loss and the plan</text>
    </g>
    <polyline points="254,112 278,112" fill="none" stroke="#1f4fd8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <polyline points="478,112 502,112" fill="none" stroke="#1f4fd8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <polyline points="702,112 726,112" fill="none" stroke="#1f4fd8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <polyline points="826,160 826,232" fill="none" stroke="#1f4fd8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <polyline points="726,280 702,280" fill="none" stroke="#1f4fd8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <polyline points="502,280 478,280" fill="none" stroke="#1f4fd8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <polyline points="278,280 254,280" fill="none" stroke="#1f4fd8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <polyline points="154,232 154,160" fill="none" stroke="#1f4fd8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="166" y="202" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f4fd8" text-anchor="start">next epoch, or the next paper</text>
    <polyline points="726,430 712,430 712,112 726,112" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow-warn)" stroke-dasharray="7 5"/>
    <text x="704" y="430" font-family="'Noto Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#b45309" text-anchor="end">the human edits</text>
    <text x="704" y="446" font-family="'Noto Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#b45309" text-anchor="end">one pending session</text>
    <text x="726" y="530" font-family="'Noto Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">Feedback keeps the parameter frozen.</text>
    <text x="726" y="546" font-family="'Noto Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">The evaluator reads the text, scores</text>
    <text x="726" y="562" font-family="'Noto Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">the stages again, and the gradient</text>
    <text x="726" y="578" font-family="'Noto Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">names the change that answers it.</text>
    <text x="54" y="600" font-family="'Noto Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">Splits</text>
    <rect x="54" y="612" width="14" height="14" rx="3" fill="#1f4fd8"/>
    <text x="76" y="624" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">train: evals/pending/</text>
    <rect x="290" y="612" width="14" height="14" rx="3" fill="#0e7490"/>
    <text x="312" y="624" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">applied: evals/applied/</text>
    <rect x="526" y="612" width="14" height="14" rx="3" fill="#15803d"/>
    <text x="548" y="624" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">validation: evals/validated/</text>
    <rect x="762" y="612" width="14" height="14" rx="3" fill="#b45309"/>
    <text x="784" y="624" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">test: evals/tested/</text>
    <text x="54" y="668" font-family="'Noto Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">The loop stops when the validation loss stops falling. The best version stays.</text>
</svg>
