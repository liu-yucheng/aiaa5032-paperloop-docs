  <title id="fig2-title">Subagents and task stages in PaperLoop</title>
  <desc id="fig2-desc">Eight stage cards in two rows. The runtime subagent runs the runtime setup. The coder runs the reproduction code, the exploration code, and the innovation code. The researcher runs the reproduction report and the innovation report. The evaluator runs the self-evaluation. The evolver runs the self-evolution.</desc>
