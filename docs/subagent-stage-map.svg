    <text x="26" y="424" font-family="'Noto Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">Each stage returns OK, RETRY, or BLOCKED. A RETRY repeats at most twice. A BLOCKED stage stops the pass and records one human intervention.</text>
