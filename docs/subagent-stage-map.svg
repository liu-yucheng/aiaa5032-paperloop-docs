<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="fig2-title fig2-desc" width="980" height="470">
  <title id="fig2-title">Subagents and task stages in PaperLoop</title>
  <desc id="fig2-desc">Seven stage cards in order. The runtime subagent runs the runtime setup. The coder runs the reproduction refactoring and the innovation experiment. The researcher runs the reproduction analysis and the innovation analysis. The evaluator runs the self-evaluation. The evolver runs the evolution planning.</desc>
